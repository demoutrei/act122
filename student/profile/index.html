<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../../assets/uspf.png"/>
    <link rel="stylesheet" href="index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample System</title>
  </head>
  <body>
    <header id="headerContent">
      <div id="header-yellow">
        <img id="header-icon" src="../../assets/uspf.png"/>
        <div id="header-title">UNIVERSITY OF SOUTHERN PHILIPPINES FOUNDATION</div>
      </div>
      <div id="header-blue">
        <nav id="topbar-navigation">
          <a class="navigation-item" style="color: white;">
            <div class="title">Profile</div>
          </a>
          <a href="../events" class="navigation-item">
            <div class="title">Events</div>
          </a>
        </nav>
      </div>
    </header>
    <main id="mainContent">
      <section id="student-profile">
        <img id="profile-picture" src="../../assets/user.png"/>
        <div id="profile-name">Demoutrei Kurosuke</div>
      </section>
      <section id="student-settings">
        <header>
          <nav>
            <button id="navigation-account" onclick="scrollToView('#section-account')">Account</button>
            <button id="navigation-notifications" onclick="scrollToView('#section-notifications')">Notifications</button>
            <button id="navigation-logOut" onclick="scrollToView('#section-logOut')">Log Out</button>
          </nav>
        </header>
        <main>
          <section id="section-account"></section>
          <section id="section-notifications"></section>
          <section id="section-logOut"></section>
        </main>
      </section>
    </main>
    <footer id="footerContent">
      <div id="footer-top">
        <img src="../../assets/uspf.png"/>
        <div id="name">UNIVERSITY OF SOUTHERN PHILIPPINES FOUNDATION</div>
      </div>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
